{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probador 3D - STATELESS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas3d { width: 100%; height: 100%; display: block; }

        .ui-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(18, 18, 18, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 22px;
            width: 320px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .back-link {
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 12px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .sub-prenda {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 16px;
        }

        .calib-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .calib-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #4da3ff;
            margin-bottom: 10px;
        }

        .slider-row {
            margin-bottom: 8px;
        }

        .slider-row label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 3px;
        }

        .slider-row input {
            width: 100%;
            accent-color: #0070f3;
            cursor: pointer;
        }

        .btn-action {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .btn-action:hover { background: rgba(255, 255, 255, 0.18); }

        #cargando {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #777;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <a href="javascript:history.back()" class="back-link">&larr; Volver al Producto</a>
        <h1>STATELESS 3D</h1>
        <div class="sub-prenda">Outfit Completo Octane</div>

        <!-- Calibrador de Brazos Naturales -->
        <div class="calib-box">
            <div class="calib-title">🕺 Postura de Brazos (Catálogo)</div>
            <div class="slider-row">
                <label><span>Codos hacia Atrás / Adelante:</span> <span id="valCodoAtras">0.45</span></label>
                <input type="range" id="codoAtrasSlider" min="-1.0" max="1.0" step="0.05" value="0.45">
            </div>
            <div class="slider-row">
                <label><span>Abrir Codos (Lados):</span> <span id="valAbrir">-0.85</span></label>
                <input type="range" id="abrirSlider" min="-1.5" max="0.0" step="0.05" value="-0.85">
            </div>
            <div class="slider-row">
                <label><span>Doblar Codo a Cintura:</span> <span id="valDoblar">-1.10</span></label>
                <input type="range" id="doblarSlider" min="-2.0" max="0.0" step="0.05" value="-1.10">
            </div>
            <div class="slider-row">
                <label><span>Ancho Caderas:</span> <span id="valCadera">0.82</span></label>
                <input type="range" id="caderaSlider" min="0.60" max="1.00" step="0.01" value="0.82">
            </div>
        </div>

        <!-- Calibrador Pantalón -->
        <div class="calib-box">
            <div class="calib-title">👖 Calibrador Pantalón</div>
            <div class="slider-row">
                <label><span>Subir / Bajar (Y):</span> <span id="valY">-0.050</span></label>
                <input type="range" id="pY" min="-0.30" max="0.20" step="0.005" value="-0.050">
            </div>
            <div class="slider-row">
                <label><span>Adelante / Atrás (Z):</span> <span id="valZ">0.030</span></label>
                <input type="range" id="pZ" min="-0.10" max="0.10" step="0.005" value="0.030">
            </div>
            <div class="slider-row">
                <label><span>Profundidad / Glúteos (Z):</span> <span id="valGrosorZ">1.25</span></label>
                <input type="range" id="pGrosorZ" min="0.80" max="1.60" step="0.01" value="1.25">
            </div>
            <div class="slider-row">
                <label><span>Largo (Eje Y):</span> <span id="valLargo">1.10</span></label>
                <input type="range" id="pLargo" min="0.80" max="1.50" step="0.01" value="1.10">
            </div>
            <div class="slider-row">
                <label><span>Ancho de Caderas (X):</span> <span id="valS">1.04</span></label>
                <input type="range" id="pS" min="0.80" max="1.40" step="0.01" value="1.04">
            </div>
        </div>

        <button id="btnToggleCamisa" class="btn-action">Ocultar Camisa</button>
        <button id="btnTogglePantalon" class="btn-action">Ocultar Pantalón</button>
    </div>

    <div id="cargando">CARGANDO MODELO 3D...</div>
    <div id="canvas3d"></div>

    <script>
        let modeloManiqui = null;
        let modeloCamisa = null;
        let modeloPantalon = null;
        let sizePBase = null;

        // Variables de Postura
        let factorCaderaX = 0.82;
        let factorCaderaZ = 0.85;

        // Nuevos ángulos corregidos (hombro normalizado, codo atrás)
        let rotCodoAtras = 0.45;
        let rotAbrir = -0.85;
        let rotDoblar = -1.10;

        // Medidas maestras de la camisa
        const AJUSTE_CAMISA = {
            posY: -0.180,
            posZ: 0.015,
            anchoHombros: 0.68,
            grosorPecho: 1.15
        };

        const clock = new THREE.Clock();
        let mixer = null;

        // 1. Escena, Cámara y Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e0e0e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.25, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas3d').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.95, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.0;
        controls.maxDistance = 4.5;

        // 2. Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const luzFrontal = new THREE.DirectionalLight(0xffffff, 2.2);
        luzFrontal.position.set(2, 4, 3);
        scene.add(luzFrontal);

        const luzTrasera = new THREE.DirectionalLight(0x8899aa, 1.4);
        luzTrasera.position.set(-2, 3, -3);
        scene.add(luzTrasera);

        // Tarima / Podio
        const podio = new THREE.Mesh(
            new THREE.CylinderGeometry(0.85, 0.9, 0.05, 48),
            new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 0.8, metalness: 0.2 })
        );
        podio.position.y = -0.025;
        scene.add(podio);

        // 3. Cargar Modelos
        const loader = new THREE.GLTFLoader();
        const urlManiqui = "{% static 'modelos/Xbot.glb' %}";
        const urlCamisa = "{% static 'modelos/camisa-polo-fuenza_blanca.glb' %}";
        const urlPantalon = "{% static 'modelos/pantalon.glb' %}";

        // Cargar Maniquí Xbot
        loader.load(urlManiqui, function(gltfManiqui) {
            modeloManiqui = gltfManiqui.scene;
            modeloManiqui.scale.set(0.98, 1, 0.92);
            modeloManiqui.position.set(0, 0, 0);

            modeloManiqui.traverse((child) => {
                if (child.isMesh) {
                    child.material = new THREE.MeshStandardMaterial({
                        color: 0x222222,
                        roughness: 0.45,
                        metalness: 0.1,
                        skinning: true
                    });
                }
            });

            if (gltfManiqui.animations && gltfManiqui.animations.length > 2) {
                mixer = new THREE.AnimationMixer(modeloManiqui);
                const idlePose = gltfManiqui.animations[2];
                const action = mixer.clipAction(idlePose);
                action.play();
            }

            scene.add(modeloManiqui);

            // Cargar Camisa Polo
            loader.load(urlCamisa, function(gltfCamisa) {
                modeloCamisa = gltfCamisa.scene;
                modeloCamisa.traverse((child) => {
                    if (child.isMesh) {
                        child.renderOrder = 10;
                        if (child.material) {
                            child.material.polygonOffset = true;
                            child.material.polygonOffsetFactor = -5.0;
                            child.material.polygonOffsetUnits = -5.0;
                            child.material.depthTest = true;
                        }
                    }
                });

                const boxC = new THREE.Box3().setFromObject(modeloCamisa);
                const sizeC = boxC.getSize(new THREE.Vector3());
                const escalaX = (AJUSTE_CAMISA.anchoHombros / sizeC.x);

                modeloCamisa.scale.set(escalaX, escalaX, escalaX * AJUSTE_CAMISA.grosorPecho);
                modeloCamisa.position.set(0, AJUSTE_CAMISA.posY, AJUSTE_CAMISA.posZ);
                scene.add(modeloCamisa);

                // Cargar Pantalón
                loader.load(urlPantalon, function(gltfPantalon) {
                    modeloPantalon = gltfPantalon.scene;

                    const boxP = new THREE.Box3().setFromObject(modeloPantalon);
                    sizePBase = boxP.getSize(new THREE.Vector3());

                    modeloPantalon.traverse((child) => {
                        if (child.isMesh) {
                            child.renderOrder = 2;
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0x141414,
                                roughness: 0.85,
                                metalness: 0.05,
                                polygonOffset: true,
                                polygonOffsetFactor: -2.0,
                                polygonOffsetUnits: -2.0,
                                depthTest: true
                            });
                        }
                    });

                    actualizarAjustePantalon();
                    scene.add(modeloPantalon);

                    const cargandoEl = document.getElementById('cargando');
                    if (cargandoEl) cargandoEl.style.opacity = '0';
                }, undefined, function(err) {
                    console.error("Error al cargar pantalón:", err);
                    const cargandoEl = document.getElementById('cargando');
                    if (cargandoEl) cargandoEl.style.opacity = '0';
                });
            });
        });

        // Eventos de Postura de Brazos
        document.getElementById('codoAtrasSlider').addEventListener('input', function(e) {
            rotCodoAtras = parseFloat(e.target.value);
            document.getElementById('valCodoAtras').textContent = rotCodoAtras.toFixed(2);
        });

        document.getElementById('abrirSlider').addEventListener('input', function(e) {
            rotAbrir = parseFloat(e.target.value);
            document.getElementById('valAbrir').textContent = rotAbrir.toFixed(2);
        });

        document.getElementById('doblarSlider').addEventListener('input', function(e) {
            rotDoblar = parseFloat(e.target.value);
            document.getElementById('valDoblar').textContent = rotDoblar.toFixed(2);
        });

        document.getElementById('caderaSlider').addEventListener('input', function(e) {
            factorCaderaX = parseFloat(e.target.value);
            factorCaderaZ = factorCaderaX * 1.03;
            document.getElementById('valCadera').textContent = factorCaderaX.toFixed(2);
        });

        // Controles Pantalón
        const pY = document.getElementById('pY');
        const pZ = document.getElementById('pZ');
        const pGrosorZ = document.getElementById('pGrosorZ');
        const pLargo = document.getElementById('pLargo');
        const pS = document.getElementById('pS');

        function actualizarAjustePantalon() {
            if (!modeloPantalon || !sizePBase) return;

            const posY = parseFloat(pY.value);
            const posZ = parseFloat(pZ.value);
            const grosorZ = parseFloat(pGrosorZ.value);
            const largoY = parseFloat(pLargo.value);
            const anchoX = parseFloat(pS.value);

            document.getElementById('valY').textContent = posY.toFixed(3);
            document.getElementById('valZ').textContent = posZ.toFixed(3);
            document.getElementById('valGrosorZ').textContent = grosorZ.toFixed(2);
            document.getElementById('valLargo').textContent = largoY.toFixed(2);
            document.getElementById('valS').textContent = anchoX.toFixed(2);

            const baseScale = (1.02 / sizePBase.y);

            modeloPantalon.scale.set(
                baseScale * anchoX, 
                baseScale * largoY, 
                baseScale * anchoX * grosorZ
            );

            modeloPantalon.position.set(0.0, -0.050, 0.030); // (X, Y, Z)
        }

        pY.addEventListener('input', actualizarAjustePantalon);
        pZ.addEventListener('input', actualizarAjustePantalon);
        pGrosorZ.addEventListener('input', actualizarAjustePantalon);
        pLargo.addEventListener('input', actualizarAjustePantalon);
        pS.addEventListener('input', actualizarAjustePantalon);

        // Botones Visibilidad Prendas
        let verCamisa = true;
        let verPantalon = true;

        document.getElementById('btnToggleCamisa').addEventListener('click', function() {
            verCamisa = !verCamisa;
            if (modeloCamisa) modeloCamisa.visible = verCamisa;
            this.textContent = verCamisa ? "Ocultar Camisa" : "Mostrar Camisa";
        });

        document.getElementById('btnTogglePantalon').addEventListener('click', function() {
            verPantalon = !verPantalon;
            if (modeloPantalon) modeloPantalon.visible = verPantalon;
            this.textContent = verPantalon ? "Ocultar Pantalón" : "Mostrar Pantalón";
        });

        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Bucle Render: POSE NATURAL CON CODOS HACIA ATRÁS Y MANOS AL FRENTE
        function animar() {
            requestAnimationFrame(animar);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            if (modeloManiqui) {
                // 1. Reducción de Cadera
                const cadera = modeloManiqui.getObjectByName('mixamorigHips');
                const espina = modeloManiqui.getObjectByName('mixamorigSpine');
                if (cadera) {
                    cadera.scale.x = factorCaderaX;
                    cadera.scale.z = factorCaderaZ;
                }
                if (espina) {
                    espina.scale.x = 1.0 / factorCaderaX;
                    espina.scale.z = 1.0 / factorCaderaZ;
                }

                // 2. POSE CATÁLOGO: CODO DOBLADO A 90° NATURAL
                const leftArm = modeloManiqui.getObjectByName('mixamorigLeftArm');
                const leftForeArm = modeloManiqui.getObjectByName('mixamorigLeftForeArm');
                const rightArm = modeloManiqui.getObjectByName('mixamorigRightArm');
                const rightForeArm = modeloManiqui.getObjectByName('mixamorigRightForeArm');

                if (leftArm && leftForeArm && rightArm && rightForeArm) {
                    // BRAZO IZQUIERDO:
                    // 1. El hombro casi neutro, apenas un toque hacia atrás
                    leftArm.rotation.x = 0.05; 
                    leftArm.rotation.y = -0.25; 
                    leftArm.rotation.z = -0.95; // Codo abierto al lado

                    // 2. EL SECRETO: El codo doblado a 90 grados (en L) hacia el frente
                    leftForeArm.rotation.x = 0.0;
                    leftForeArm.rotation.y = 0.35;
                    leftForeArm.rotation.z = -1.55; // 90° de doblez

                    // BRAZO DERECHO (Espejo simétrico perfecto):
                    rightArm.rotation.x = 0.05;
                    rightArm.rotation.y = 0.25;
                    rightArm.rotation.z = 0.95;

                    rightForeArm.rotation.x = 0.0;
                    rightForeArm.rotation.y = -0.35;
                    rightForeArm.rotation.z = 1.55;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animar();
    </script>
</body>
</html>
