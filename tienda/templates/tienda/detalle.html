<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ prenda.nombre }} - STATELESS</title>
</head>
<body style="background-color: #0b0b0b; color: #ffffff; font-family: sans-serif; padding: 30px;">

    <a href="{% url 'inicio' %}" style="color: #888; text-decoration: none;">&larr; Volver al inicio</a>

    <div style="margin-top: 20px; max-width: 500px; border: 1px solid #222; padding: 25px; background: #141414; border-radius: 8px;">
        <span style="color: #888; font-size: 12px; text-transform: uppercase;">{{ prenda.categoria.nombre }}</span>
        <h1 style="margin-top: 5px;">{{ prenda.nombre }}</h1>
        <h2 style="color: #ddd;">${{ prenda.precio }} COP</h2>
        
        <p style="color: #aaa;">{{ prenda.descripcion|default:"Sin descripción" }}</p>

        <!-- Campo de Altura del usuario -->
        <div style="margin-top: 20px; padding: 12px; background: #1c1c1c; border-radius: 6px;">
            <label style="font-size: 13px; color: #ccc; display: block; margin-bottom: 5px;">
                Ingresa tu altura (en cm):
            </label>
            <input type="number" id="inputAltura" placeholder="Ej: 185" style="width: 100px; padding: 8px; background: #0b0b0b; color: #fff; border: 1px solid #444; border-radius: 4px;">
            <span style="font-size: 12px; color: #888;">cm</span>
        </div>

        <!-- Selector de Tallas -->
        <div style="margin-top: 20px;">
            <p style="margin-bottom: 8px; font-size: 14px;">TALLA: SELECCIONA</p>
            <div style="display: flex; gap: 10px;">
                {% for t in tallas %}
                    <button type="button" class="btn-talla" data-talla="{{ t }}" style="background: #222; color: #fff; border: 1px solid #444; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold;">
                        {{ t }}
                    </button>
                {% endfor %}
            </div>
        </div>

        <!-- Caja de Mensaje del Recomendador de Talla -->
        <div id="mensajeTalla" style="display: none; margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.4;"></div>

        <!-- Botón Añadir -->
        <button style="margin-top: 20px; width: 100%; padding: 12px; background: #ffffff; color: #000; font-weight: bold; border: none; cursor: pointer; border-radius: 4px;">
            AÑADIR AL CARRITO
        </button>

        <!-- Botón Probar en Maniquí 3D -->
        <a id="btn-probador-3d"
        href="/probador-3d/?prenda={{ prenda.nombre|slugify }}"
        style="display:inline-block; margin-top:16px; padding:12px 22px; background:#fff; color:#000; text-decoration:none; font-weight:600; border-radius:6px;">
        Probar en Modelo 3D &rarr;
        </a>
    </div>

    <!-- JavaScript para hacer el cálculo sin recargar -->
<script>
        const prendaId = "{{ prenda.id }}";
        const prendaSlug = "{{ prenda.slug }}";
        const inputAltura = document.getElementById('inputAltura');
        const cajaMensaje = document.getElementById('mensajeTalla');
        const btnProbar3D = document.getElementById('btnProbar3D');
        let tallaSeleccionada = null;

        document.querySelectorAll('.btn-talla').forEach(boton => {
            boton.addEventListener('click', function() {
                document.querySelectorAll('.btn-talla').forEach(b => b.style.borderColor = '#444');
                this.style.borderColor = '#fff';

                tallaSeleccionada = this.getAttribute('data-talla');
                consultarTalla();
            });
        });

        inputAltura.addEventListener('input', function() {
            if (tallaSeleccionada) {
                consultarTalla();
            }
        });

        function consultarTalla() {
            const altura = inputAltura.value;
            if (!altura || !tallaSeleccionada) return;

            fetch(`/api/verificar-talla/?prenda_id=${prendaId}&talla=${tallaSeleccionada}&altura=${altura}`)
                .then(res => res.json())
                .then(data => {
                    if (data.mensaje) {
                        cajaMensaje.style.display = 'block';
                        cajaMensaje.innerText = data.mensaje;

                        if (data.alerta) {
                            cajaMensaje.style.background = '#332700';
                            cajaMensaje.style.border = '1px solid #d4a017';
                            cajaMensaje.style.color = '#ffebaa';
                        } else {
                            cajaMensaje.style.background = '#0a2e12';
                            cajaMensaje.style.border = '1px solid #28a745';
                            cajaMensaje.style.color = '#c3e6cb';
                        }
                    }
                });
        }

        // Al hacer clic en el botón 3D, redirige al probador con la altura
        btnProbar3D.addEventListener('click', function() {
            const altura = inputAltura.value || '175';
            window.location.href = `/probador-3d/?prenda=${prendaSlug}&altura=${altura}`;
        });
    </script>

</body>
</html>
