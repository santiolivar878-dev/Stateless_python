<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STATELESS // DETALLE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .product-container {
            display: flex;
            flex-wrap: wrap;
            max-width: 900px;
            background: #12121a;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .product-media {
            flex: 1;
            min-width: 320px;
            background: #181824;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            flex: 1;
            min-width: 320px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .brand { font-size: 0.8rem; letter-spacing: 3px; color: #888; text-transform: uppercase; }
        h1 { font-size: 2rem; margin: 10px 0; }
        .price { font-size: 1.8rem; color: #00ffcc; font-weight: bold; margin-bottom: 20px; }
        .description-box {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid #00ffcc;
            padding: 15px;
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 30px;
        }
        .ai-badge {
            font-size: 0.75rem;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }
        .btn-3d {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            color: #000;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn-3d:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>

<div class="fit-finder-box">
    <h3>📏 Probador de Tallas (Fit Finder)</h3>
    <p>Ingresa tu ancho de pecho aproximado (cm) para calcular tu ajuste:</p>
    <div style="display: flex; gap: 10px; margin: 10px 0;">
        <input type="number" id="user-chest" placeholder="Ej: 52 cm" style="padding: 8px; background: #1a1a24; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 4px; width: 120px;">
        <button onclick="calculateFit()" style="background: #00ffcc; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer;">Calcular</button>
    </div>
    <p id="fit-result" style="font-size: 0.9rem; color: #00ffcc; margin-top: 5px;"></p>
</div>

<body>

    <div class="product-container" id="product-detail">
        <!-- Se cargará mediante JavaScript -->
    </div>

<script>
        let currentProduct = null; // Variable global para guardar los datos de la prenda

        // Obtener el ID del producto desde la URL (?id=X)
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (productId) {
            fetch(`http://127.0.0.1:8000/api/products/${productId}/`)
                .then(res => res.json())
                .then(product => {
                    // ⚡ ¡Aquí guardamos el producto en la variable global!
                    currentProduct = product;

                    const container = document.getElementById('product-detail');
                    const imageUrl = product.image ? product.image : 'https://via.placeholder.com/400x500?text=STATELESS';

                    container.innerHTML = `
                        <div class="product-media">
                            <img src="${imageUrl}" alt="${product.name}">
                        </div>
                        <div class="product-info">
                            <div>
                                <span class="brand">STATELESS // COLLECTION</span>
                                <h1>${product.name}</h1>
                                <div class="price">$${product.price}</div>
                                
                                <div class="description-box">
                                    <span class="ai-badge">⚡ Generado por Gemini AI</span>
                                    <p>${product.description || 'Sin descripción disponible.'}</p>
                                </div>

                                <!-- Bloque del Fit Finder integrado -->
                                <div class="fit-finder-box" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                                    <h3 style="font-size: 1rem; margin-bottom: 8px;">📏 Probador de Tallas (Fit Finder)</h3>
                                    <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 10px;">Ingresa tu ancho de pecho aproximado (cm):</p>
                                    <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                                        <input type="number" id="user-chest" placeholder="Ej: 52" style="padding: 8px; background: #1a1a24; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 4px; width: 120px;">
                                        <button onclick="calculateFit()" style="background: #00ffcc; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; color: #000;">Calcular</button>
                                    </div>
                                    <p id="fit-result" style="font-size: 0.85rem; color: #00ffcc; margin-top: 5px;"></p>
                                </div>
                            </div>

                            <a href="3d-viewer.html?id=${product.id}" target="_blank" class="btn-3d" style="margin-top: 20px;">
                                👓 Probar en Avatar 3D
                            </a>
                        </div>
                    `;
                })
                .catch(err => console.error('Error al cargar detalle:', err));
        }

        // Función que calcula el ajuste usando los datos reales de la prenda
        function calculateFit() {
            if (!currentProduct) return;
            const userChest = parseFloat(document.getElementById('user-chest').value);
            const resultEl = document.getElementById('fit-result');

            if (isNaN(userChest)) {
                resultEl.innerText = "Por favor ingresa una medida válida.";
                return;
            }

            const diff = currentProduct.chest_width - userChest;

            if (diff < 2) {
                resultEl.innerText = "⚠️ Ajustado (Slim Fit): Te quedará muy ceñido al cuerpo.";
            } else if (diff >= 2 && diff <= 6) {
                resultEl.innerText = "✨ Ajuste Perfecto (Regular Fit): Ideal para ti.";
            } else {
                resultEl.innerText = "🧥 Estilo Holgado (Oversized): Quedará suelto y moderno.";
            }
        }
    </script>
</body>
</html>
